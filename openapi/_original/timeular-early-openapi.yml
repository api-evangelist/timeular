          description: Bad Request
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
  /api/v4/time-entries:
    post:
      summary: Create Time Entry
      operationId: createTimeEntry
      tags:
      - Time Entries
      description: 'With this endpoint, you can create a new Time Entry. It should be connected to an Activity and have a
        duration no shorter than 1 minute. A Note can be provided too, but it’s not required. Within this Note, you can refer
        one or more Tags or Mentions.

        These Tags and Mentions need to be referenced by their ID and put inside a special prefix and suffix, &lt;{{|t|1|}}&gt;
        for the tag with id 1 and &lt;{{|m|1|}}&gt; for the mention with id 1.

        If the related Activity is bound to some Integration, let’s say a JIRA Project, JIRA task IDs is a valid Mention.
        The Time Entry will be created even if it overlaps with other Time Entries – in result existing Time Entries will
        be split or deleted in such manner, that new one will fit without overlapping.'
      requestBody:
        required: true
        content:
          application/json:
            example:
              activityId: '1'
              startedAt: '2016-08-05T06:00:00.000'
              stoppedAt: '2016-08-05T07:00:00.000'
              note:
                text: 99 sheep <{{|t|1|}}> <{{|m|1|}}>
      responses:
        '201':
          description: Created Time Entry
          content:
            application/json:
              example:
                id: '1'
                activity:
                  id: '1'
                  name: abc
                  color: '#000000'
                  folderId: '1'
                duration:
                  startedAt: '2016-08-05T06:00:00.000'
                  stoppedAt: '2016-08-05T07:00:00.000'
                note:
                  text: 99 sheep <{{|t|1|}}><{{|m|1|}}>
                  tags:
                  - id: 1
                    key: dabf59bc-9997-44ca-9451-e753a11090c4
                    label: some-tag
                    scope: timeular
                    folderId: '1'
                  mentions:
                  - id: 1
                    key: debf59bc-9997-44ca-9451-e753a11090c4
                    label: some mention
                    scope: timeular
                    folderId: '1'
                errors: []
        '500':
          description: Integration-related error, eg. if new Time Entry somehow conflicts with data on the Integration side
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
        '404':
          description: Activity not found
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
