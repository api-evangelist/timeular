                  message: Explanation of what has happened
  /api/v4/tracking/stop:
    post:
      summary: Stop Tracking
      operationId: stopTracking
      tags:
      - Current Tracking
      description: 'With this endpoint you can create a new Time Entry by stopping the current tracking. The resulting Time
        Entry should have a duration no shorter than 1 minute.

        The time entry will be created even if it overlaps with other Time Entries – in result existing Time Entries will
        be split or deleted in such manner, that the new one will fit without overlapping.'
      requestBody:
        required: true
        content:
          application/json:
            example:
              stoppedAt: '2016-02-03T05:00:00.000'
      responses:
        '200':
          description: Created Time Entry
          content:
            application/json:
              example:
                id: '34714420'
                activity:
                  id: '1217348'
                  name: abc
                  color: '#000000'
                  folderId: '1'
                duration:
                  startedAt: '2020-02-03T04:00:00.000'
                  stoppedAt: '2020-08-03T05:00:00.000'
                note:
                  text: null
                  tags: []
                  mentions: []
                errors:
                - 'Third Party Service error: status code = 400, message = ''no integration found for 111525 and integrationType
                  toggl'''
                - 'Third Party Service error: status code = 400, message = ''no integration found for 111525 and integrationType
                  toggl'''
                - 'Third Party Service error: status code = 400, message = ''no integration found for 111525 and integrationType
                  harvest'''
                - 'Third Party Service error: status code = 400, message = ''no integration found for 111525 and integrationType
                  harvest'''
                - 'Third Party Service error: status code = 400, message = ''no integration found for 111525 and integrationType
                  toggl'''
        '404':
          description: Activity not found
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
        '409':
          description: Tracking is not started
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
  /api/v4/time-entries/{timestamp}/{timestamp}:
