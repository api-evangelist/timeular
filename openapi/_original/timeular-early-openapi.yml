    patch:
      summary: Edit a Time Entry
      operationId: editATimeEntry
      tags:
      - Time Entries
      description: 'With this endpoint you can edit an existing time entry. When changing the activity ID please note, that
        both the new and old activity attached to time entry have to belong to same integration.

        To remove a note, just set the complete object to null and all values within the object will be deleted too.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            example:
              activityId: '1'
              startedAt: '2016-08-05T06:01:00.000'
              stoppedAt: '2016-08-05T07:01:00.000'
              note:
                text: 200 sheep <{{|t|1|}}> <{{|m|1|}}>
      responses:
        '200':
          description: Edited Time Entry
          content:
            application/json:
              example:
                id: '1'
                activity:
                  id: '1'
                  name: abc
                  color: '#000000'
                  folderId: '1'
                duration:
                  startedAt: '2016-08-05T06:00:00.000'
                  stoppedAt: '2016-08-05T07:00:00.000'
                note:
                  text: 200 sheep <{{|t|1|}}><{{|m|1|}}>
                  tags:
                  - id: 1
                    key: dabf59bc-9997-44ca-9451-e753a11090c4
                    label: some-tag
                    scope: timeular
                    folderId: '1'
                  mentions:
                  - id: 1
                    key: debf59bc-9997-44ca-9451-e753a11090c4
                    label: some mention
                    scope: timeular
                    folderId: '1'
                errors: []
        '404':
          description: Activity or Time Entry not found
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                error:
