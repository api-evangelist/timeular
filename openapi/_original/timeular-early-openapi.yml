  /api/v4/tracking:
    get:
      summary: Show current Tracking
      operationId: showCurrentTracking
      tags:
      - Current Tracking
      responses:
        '200':
          description: Current Tracking
          content:
            application/json:
              example:
                id: 1
                activity:
                  id: '1217348'
                  name: abc
                  color: '#000000'
                  folderId: '1'
                startedAt: '2020-08-03T04:00:00.000'
                note:
                  text: 99 sheep <{{|t|1|}}><{{|m|2|}}>
                  tags:
                  - id: 1
                    key: 3b381b24-c690-4000-9079-7355579162fb
                    label: some tag
                    scope: timeular
                    folderId: '1'
                  mentions:
                  - id: 2
                    key: 2b381b24-c690-4000-9079-7355579162fb
                    label: some-mention
                    scope: timeular
                    folderId: '1'
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
        '404':
          description: There is no current Tracking
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
    patch:
      summary: Edit Tracking
      operationId: editTracking
      tags:
      - Current Tracking
      description: 'With this endpoint you can set/edit/remove the note of your current Tracking.

        To remove the note set it to null/empty/blank. You can provide one or more Tags and Mentions in a note, each of them
        prefixed with # or @. If the related activity is bound to some Integration, let’s say a JIRA Project, JIRA task IDs
        are valid Mentions too.'
      requestBody:
        required: true
        content:
          application/json:
            example:
              note:
                text: 99 sheep <{{|t|1|}}> <{{|m|1|}}>
              activityId: '1'
              startedAt: '2016-02-03T04:00:00.000'
      responses:
        '200':
          description: Edited current Tracking
          content:
            application/json:
              example:
                id: 1
                activity:
                  id: '1217348'
                  name: abc
                  color: '#000000'
                  folderId: '1'
                startedAt: '2020-08-03T04:00:00.000'
                note:
                  text: 99 sheep <{{|t|1|}}><{{|m|2|}}>
                  tags:
                  - id: 1
                    key: 3b381b24-c690-4000-9079-7355579162fb
                    label: some tag
                    scope: timeular
                    folderId: '1'
                  mentions:
                  - id: 2
                    key: 2b381b24-c690-4000-9079-7355579162fb
                    label: some-mention
                    scope: timeular
                    folderId: '1'
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
        '409':
          description: There is no Tracking or Tracking for another Activity is ongoing
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
        '404':
          description: ActivityId Not Found
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
    delete:
      summary: Cancel Tracking
      operationId: cancelTracking
      tags:
      - Current Tracking
      description: With this endpoint you can cancel your current Tracking. New Time Entry won't be created.
      responses:
        '200':
          description: Cancelled current Tracking
          content:
            application/json:
              example:
                id: 1
                activity:
                  id: '1217348'
                  name: abc
                  color: '#000000'
                  folderId: '1'
                startedAt: '2020-08-03T04:00:00.000'
                note:
                  text: 99 sheep <{{|t|1|}}><{{|m|2|}}>
                  tags:
                  - id: 1
                    key: 3b381b24-c690-4000-9079-7355579162fb
                    label: some tag
                    scope: timeular
                    folderId: '1'
                  mentions:
                  - id: 2
                    key: 2b381b24-c690-4000-9079-7355579162fb
                    label: some-mention
                    scope: timeular
                    folderId: '1'
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
  /api/v4/tracking/{id}/start:
