      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            example:
              typeId: '1'
              startDate: '2025-01-01T06:00:00.000'
              endDate: '2025-01-01T20:00:00.000'
              note: Extra day off
      responses:
        '200':
          description: Unauthorized
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
  /api/v4/leaves/{id}/approve:
    post:
      summary: Approve a Leave
      operationId: approveALeave
      tags:
      - Leaves
      description: 'Approve a Leave of Team member. Requires Admin or Owner role.

        Future Leave can be approved regardless of its status, so it''s possible to change status of a future Leave from denied
        to approved using this endpoint. Only pending past Leave can be approved.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Approved Leave
          content:
            application/json:
              example:
                id: '1'
                typeId: '1'
                startDate: '2025-01-01T00:00:00.000'
                endDate: '2025-01-01T23:59:59.999'
                note: null
                status: approved
                user:
                  id: '2'
                  name: My teammate
                  email: my-teammate@example.com
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                error:
                  message: Only pending time leaves can be approved in the past
  /api/v4/leaves/{id}/deny:
    post:
      summary: Deny a Leave
      operationId: denyALeave
      tags:
      - Leaves
      description: 'Deny a Leave of Team member. Requires Admin or Owner role.

        Future Leave can be denied regardless of its status, so it''s possible to change status of a future Leave from approved
        to denied using this endpoint. Only pending past Leave can be denied.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Denied Leave
          content:
            application/json:
              example:
                id: '1'
                typeId: '1'
                startDate: '2025-01-01T00:00:00.000'
                endDate: '2025-01-01T23:59:59.999'
                note: null
                status: denied
                user:
                  id: '2'
                  name: My teammate
                  email: my-teammate@example.com
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                error:
                  message: Only pending time leaves can be denied in the past
  /api/v4/leaves/{id}:
    delete:
      summary: Delete a Leave
      operationId: deleteALeave
      tags:
      - Leaves
      description: 'Delete a Leave. If it''s a Leave of another Team member, action requires Admin or Owner role.

        This is an irreversible action. If you want to deny a Leave use Deny a Leave endpoint instead.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                message: success
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
  /api/v4/webhooks/event:
    get:
      summary: List available events
      operationId: listAvailableEvents
      tags:
      - Webhooks
      description: Returns a list of events, which can be subscribed to.
      responses:
        '200':
          description: List of Events
          content:
            application/json:
              example:
                events:
                - timeEntryCreated
                - timeEntryUpdated
                - timeEntryDeleted
                - trackingStarted
                - trackingStopped
                - trackingEdited
                - trackingCanceled
                - activityCreated
                - activityUpdated
                - activityDeleted
                - folderCreated
                - folderUpdated
                - folderDeleted
                - timeLeaveCreated
                - timeLeaveUpdated
                - timeLeaveDeleted
                - timeLeaveApproved
                - timeLeaveDenied
  /api/v4/webhooks/subscription:
    post:
      summary: Subscribe
      operationId: subscribe
      tags:
      - Webhooks
      description: 'Creates a webhook subscription for the given event. That means that if the event happens (e.g. a time
        entry is created), the given target url will be called with the payload of the event.

        The URL needs to be a valid, publicly reachable, HTTPS URL.

        The webhook has a timeout of 10 seconds, so if it takes longer to call the given URL, it will fail.

        If the given target URL returns a 410 GONE error, this webhook subscription will automatically be unsubscribed.

        See the Webhooks description for further information about the payloads.'
      requestBody:
        required: true
        content:
          application/json:
            example:
              event: trackingStarted
              target_url: https://example.org/some-endpoint
      responses:
        '200':
          description: Subscription ID
          content:
            application/json:
              example:
                id: '123456'
        '400':
          description: Maximum Number of Subscriptions per Event
          content:
            application/json:
              example:
                message: maximum subscriptions per event exceeded
                status: 400 Bad Request
    get:
      summary: List Subscriptions
      operationId: listSubscriptions
      tags:
      - Webhooks
      description: Lists all webhook subscriptions for the current user.
      responses:
        '200':
          description: List of subscriptions
          content:
            application/json:
              example:
                subscriptions:
                - id: '123456'
                  event: trackingStarted
                  target_url: https://example.org/some-endpoint
    delete:
      summary: Unsubscribe all for User
      operationId: unsubscribeAllForUser
      tags:
      - Webhooks
      description: Removes all webhooks subscriptions for the current user.
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                message: success
  /api/v4/webhooks/subscription/{id}:
    delete:
      summary: Unsubscribe
      operationId: unsubscribe
      tags:
      - Webhooks
      description: Removes a webhook subscription by id.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Unsubscribe
          content:
            application/json:
              example:
                message: success
        '404':
          description: Subscription not found
          content:
            application/json:
              example:
                message: could not find subscription with id 123456
                status: 404 Not Found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access Token obtained from POST /developer/sign-in using your API Key and API Secret.
