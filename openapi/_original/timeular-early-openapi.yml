              example:
                id: '1'
                name: deeper sleeping
                color: '#f9e8d7'
                folderId: '1'
        '404':
          description: Activity not found
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                error:
                  message: Explanation of what has happened
    delete:
      summary: Archive an Activity
      operationId: archiveAnActivity
      tags:
      - Activities
      parameters:
      - name: id
        in: path
        required: true
