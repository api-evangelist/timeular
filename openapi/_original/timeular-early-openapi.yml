                  note:
                    text: If there is a possibility of several things going wrong, the one that will cause the most damage
                      will be the one to go wrong <{{|t|2|}}><{{|t|1|}}><{{|m|1|}}><{{|m|2|}}>
                    tags:
                    - id: 1
                      key: 43d10bff-65c6-4aab-879e-8e4b9106c99d
                      label: burst
                      scope: timeular
                      folderId: '1'
                    - id: 2
                      key: 849ab930-4492-4b73-b378-8bff6d12fdd0
                      label: interpret
                      scope: timeular
                      folderId: '1'
                    mentions:
                    - id: 1
                      key: 8ed8ca39-813b-4f9d-a1ba-9a18b6c001e0
                      label: Joanie
                      scope: timeular
                      folderId: '1'
                    - id: 2
                      key: 999f14a2-c0d2-430a-b1c0-23495f96b1cb
                      label: Violette
                      scope: timeular
                      folderId: '1'
