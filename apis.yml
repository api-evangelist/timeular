aid: timeular
name: Timeular
description: >-
  Timeular (now branded EARLY) is a time-tracking company whose apps and physical
  tracking device help individuals and teams capture where their time goes. Its
  public REST API — hosted at api.early.app — lets developers manage activities,
  start and stop live tracking, create and query time entries over date ranges,
  generate reports, organize tags and mentions, administer folders, users and
  leave, and subscribe to webhooks for time-tracking and leave events. Authentication
  uses an API Key and API Secret exchanged for a short-lived Bearer Access Token.
  The API is versioned in the URI path (V4 is current; V3 and V2 remain available)
  and is published as a public Postman collection. Timeular is backed by Speedinvest.
url: https://raw.githubusercontent.com/api-evangelist/timeular/refs/heads/main/apis.yml
